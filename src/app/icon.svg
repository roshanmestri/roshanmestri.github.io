  <clipPath id="caps"><rect x="0" y="13.75" width="64" height="36.5"/></clipPath>
  <g clip-path="url(#caps)" fill="none" stroke="#fff" stroke-width="4.5" stroke-miterlimit="20">
    <!-- R: stem and bowl -->
